services:
  - type: worker
    name: vt-telegram-finder
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    plan: starter
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: SESSION_STRING
        sync: false
      - key: TARGET_CHAT
        sync: false
      - key: KEYWORDS
        sync: false
