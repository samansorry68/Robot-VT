<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود مدیر | V.T News Map</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"></head>
<body class="bg-light"><main class="container py-5" style="max-width:440px"><div class="card shadow-sm"><div class="card-body p-4"><h3>🗺️ V.T News Map</h3><p>ورود مدیر سامانه</p>{% for m in get_flashed_messages() %}<div class="alert alert-warning">{{m}}</div>{% endfor %}<form method="post"><label class="form-label">نام کاربری</label><input class="form-control mb-3" name="username" required><label class="form-label">رمز عبور</label><input class="form-control mb-3" type="password" name="password" required><button class="btn btn-primary w-100">ورود</button></form></div></div></main></body></html>
